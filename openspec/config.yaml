schema: spec-driven

# Injected into every OpenSpec artifact instruction. Keep this current; it is the
# project brief for the next agent. Do not paste this block into proposal/spec/design/tasks.
context: |
  Product: "בונה אפיונים" (Glassix Spec Builder). Hebrew/RTL SPA for a PM (non-developer)
  to assemble a technical integration spec. Frontend lives in client/; API in server/.
  The four-step wizard collects the product data, compiles it to schemaVersion 4 JSON,
  wraps it with client/src/prompts/ai-review.md, and uses that text to seed the in-app
  Claude chat. Claude asks clarification questions and returns the final Markdown spec.

  Greenfield product: treat every new feature as shipping into a new system. Do not add
  backward-compatibility layers, legacy format converters, or round-trip keys for
  superseded shapes unless the user explicitly asks. Load-time sanitization (repair corrupt
  localStorage so the app does not crash) is allowed; migration of old data formats is not.

  Frontend stack: plain JavaScript React (.jsx) + Vite 8 + Tailwind CSS v4
  (@tailwindcss/vite; tokens live in client/src/index.css @theme; no tailwind.config.js)
  + MUI with Emotion RTL + Ant Design Steps + @xyflow/react + @assistant-ui/react
  + lucide-react + marked. Types are JSDoc @typedef next to frontend factories
  (see client/src/workflow/model.js); @types/react is editor-only and the client has no
  tsconfig.json. Frontend linting is oxlint. Backend stack: TypeScript + Express 5 +
  Zod + official @anthropic-ai/sdk + Winston. If a change needs a new dependency,
  tool, or test setup, propose it and wait for approval. Verify frontend changes with
  npm run lint and npm run build; verify backend changes with npm run build:server;
  UI changes also require a real browser pass.

  Layout is a four-step wizard; client/src/App.jsx owns most state via useState:
    Step 1: AdminSection + BusinessSection
    Step 2: WorkflowSection
    Step 3: free-form technical blocks
    Step 4: AiChatStep
  Blocks are added/removed via AddBlockPopover and rendered in DynamicBlock, except
  http which uses HttpBlockCard. Shared form primitives live in
  client/src/components/ui.jsx (Field, Input, Textarea, Select and Checkbox wrap MUI;
  GhostButton, GhostAddRow and DeleteButton remain local controls). App.jsx installs
  the MUI RTL ThemeProvider; WizardStepper uses Ant Design. Non-trivial UI or other
  well-solved problems should use a maintained library (ask before installing).

  Technical block types (client/src/constants.js BLOCK_META + client/src/lib.js makeBlock):
    http, freeText, testData, table.
  INTERNAL_SYSTEMS = glassix, consist; anything else is 3rd-party (payloads required).
  HttpBlock is split: client/src/components/HttpBlock.jsx plus client/src/components/http/
  (CurlImport, PayloadEditor, HeadersEditor, MappingTable, SecurityFields).
  iframe-block-demo.html is a standalone visual prototype for a possible iframe block.
  It is NOT wired into BLOCK_META, makeBlock, or the app. Do not treat it as shipped.

  Workflows (client/src/workflow/): multiple independent graphs, not a linear list.
    model.js     — Workflow / WorkflowNode / WorkflowEdge factories. makeWorkflow()
                   seeds START→END when no nodes given.
    constants.js — NODE_META / WORKFLOW_NODE_TYPES is the single source of truth.
                   Current types: START, ACTION, DECISION, HTTP_REQUEST, END.
                   Palette ADDABLE (WorkflowNodePalette.jsx) is ACTION, DECISION,
                   HTTP_REQUEST, END. Keep palette, NODE_META, and every switch on
                   node.type in sync when adding a type.
    useWorkflows.js — the one owner of workflows / activeWorkflowId / selectedNodeId
                   and all mutators. Instantiated in App.jsx, provided via
                   WorkflowsContext (WorkflowSection.jsx). Call useWorkflowsApi()
                   from workflow UI. Mutators return { ok: true } | { ok: false, error }.
    validation.js — structural graph checks (name/trigger, START/END, dead ends,
                   orphans unless config.draft, DECISION ≥2 labeled routes,
                   HTTP_REQUEST should reference a block).
    load.js       — load-time sanitization only; never mutates in place. Unknown node
                   types are kept and flagged, never silently dropped.
    rfAdapter.js  — pure model ↔ React Flow reshape. No domain logic here.
  Canvas rules that bite:
    - WorkflowCanvas MERGES incoming node data into existing RF nodes
      (setRfNodes(current => …)); wholesale replace wipes measured dimensions
      and breaks edges.
    - WorkflowNodeCard must call useUpdateNodeInternals() keyed on handle count
      (DECISION routes re-space handles without resizing the 240px card). Any
      future type with a dynamic handle count needs the same.
    - Palette dropdown is createPortal(document.body) because the canvas clips
      overflow. React Flow is LTR-internal; sourceHandle / positions need RTL care.
    - A hidden browser pane cannot measure the canvas; nodes stay visibility:hidden
      and edges vanish. That is the pane, not a graph bug.

  Form + workflow validation:
    client/src/validation/ (issue.js, rules.js, index.js) produces a flat Issue[] for
    admin/business/blocks. App concatenates wf.issues. Step-level errors block forward
    navigation. Advancing from Step 3 marks Steps 1–3 attempted and runs the full-form
    check: errors open ValidationModal and block Step 4; warnings do not block. Field
    errors appear after the relevant step is attempted, then update live. Untouched
    blocks produce one EMPTY_BLOCK warning and no errors. Do not invent a second
    validation path.

  Export (client/src/lib.js compileSpec):
    Output keys: meta, administrative, businessNeed, workflows, technicalBlocks.
    Drops UI-only fields (canvas position, dangling edges) and ALL uuids.
    Cross-refs are PM wording via uniqueRef (suffix " (2)" on collisions).
    Each workflow becomes a steps[] (BFS from START); routes are inline
    next: [{ to, when, condition }] where `to` is the target step name.
    Unreachable nodes are kept with unreachableFromStart: true.
    HTTP_REQUEST.config.blockId exports as integrationBlock = technicalBlocks[].name
    (null if unlinked). buildAiExportText() concatenates JSON + ai-review.md (?raw).
    If the workflows JSON shape changes, update ai-review.md §3/§4 to match.
    Also: parseCurl, markdownToWordHtml (MarkdownToWordModal — "המרת אפיון AI ל-Word").

  Step 4 chat flow (implemented, session is not persisted):
    - Entering Step 4 after successful validation creates a client UUID and freezes a
      seed from buildAiExportText(compileSpec(...)). Leaving Step 4 clears that session.
    - AiChatStep uses @assistant-ui/react AssistantRuntimeProvider + useLocalRuntime.
      useChatAdapter converts assistant-ui messages into string history/current turn.
    - client/src/api/chatApi.js POSTs the session, seed, history and turn to /api/chat,
      then parses SSE text, final, done and error events. Vite proxies /api to port 3001.
    - Express mounts POST /api/chat with rate limiting and Zod request validation.
      The server is stateless for chat history; the client resends visible history on
      every turn. Client abort closes the Claude request.
    - claudeTransformer builds the official SDK stream request with configured model
      and MAX_TOKENS, one-hour ephemeral cache control, thinking disabled, the seed as
      system text, and the strict submit_final_spec tool with automatic choice.
    - claudeService forwards text deltas immediately. After stream completion it
      validates the final tool payload; text becomes bubbles, a valid tool call emits
      the final Markdown card and locks the composer, then done carries token usage.
    - The fixed-height chat shell scrolls internally. User and assistant bubbles show
      copy-on-hover with copied checkmarks. Waiting is a pulse without a bubble;
      ScrollToBottom is hidden while already at the bottom.
    - server/src/logger writes info-level chat and Claude timing/stream events to console
      and server/logs/YYYY-MM-DD.log. server/data/usage.json is keyed by sessionId and
      stores session totals plus successful completed turns: request config and sizes,
      duration, response metadata, and the complete Anthropic usage object. Failed or
      aborted turns are in operational logs, not usage.json.

  Persistence: localStorage key glassix-spec-builder:draft:v1
    { admin, business, workflows, blocks, wizard }, 600ms debounce in App.jsx.
    Theme: glassix-spec-builder:theme. Dark mode = .dark on <html>.
    Load-time sanitization in client/src/persistence/draft.js (admin/business/blocks/wizard)
    and client/src/workflow/load.js (workflows). Merge saved data with defaults; repair
    corrupt shapes so a bad draft never white-screens the app.

  UI constraints: dir="rtl" throughout; user-facing copy is Hebrew. Prefer
  logical CSS (start/end, ps/pe, ms/me). Dark counterparts for every colour.
  Workflow-canvas dark tokens are scoped under .wf-canvas .react-flow in
  index.css — do not restyle React Flow globally. Tailwind equal-specificity
  utilities resolve by generated stylesheet order, not class-string order;
  do not layer border-red-* on top of border-stone-* and expect it to win.

  OpenSpec state is stored under openspec/specs and openspec/changes. Inspect the
  current directories instead of relying on hard-coded change status or historical
  handoff files. This config and the current source tree are the project context.

rules:
  proposal:
    - Always include a Non-goals section.
    - Name the user (PM, Hebrew, non-developer) and the four-step path ending in
      the in-app Claude chat seeded by compiled JSON + ai-review.md.
  specs:
    - Specs describe observable PM-facing behaviour in Hebrew UI terms, plus
      the compiled JSON contract when export is in scope.
    - Do not require ids in the exported JSON. Names (uniqueRef) are the only
      cross-references between workflows.steps and technicalBlocks.
    - When adding a workflow node type, the spec must cover NODE_META, palette
      ADDABLE, panel switch, validation, rfAdapter handles, and compileSpec
      flattening — those must stay in lockstep.
    - When adding a technical block type, the spec must cover BLOCK_META,
      makeBlock, App.jsx renderer, validateBlock / isBlockEmpty, and compileSpec.
    - Persistence changes must sanitize on load so corrupt drafts never crash the app.
  design:
    - >-
      Greenfield only: no backward-compatibility code, legacy migrations, or support for
      superseded draft/export shapes unless the user explicitly requests it.
    - >-
      Prefer extending existing modules (client/src/validation, client/src/workflow, client/src/lib.js)
      over new abstraction layers. If a library is the right tool, propose it
      and use it after approval — UI or otherwise.
    - >-
      Call out React Flow hazards if the canvas is touched (merge-not-replace
      nodes, useUpdateNodeInternals on dynamic handles, portal the palette).
    - RTL + dark mode are not optional polish; they are design constraints.
    - iframe-block-demo.html is a prototype only until BLOCK_META ships it.
  tasks:
    - Chunks small enough to lint + build + one focused browser check.
    - Every task that changes UI must include a browser verification step
      (not a screenshot-only check). Hidden browser pane cannot measure the
      workflow canvas.
    - Needed libraries/tools are allowed. Ask before adding a dependency;
      do not hand-roll a worse substitute.
    - If compileSpec or workflows JSON shape changes, include a task to update
      client/src/prompts/ai-review.md §3/§4.

operations:
  apply:
    guidance:
      - If a new library, tool, or test setup is needed, ask first, then use it.
        Never skip a needed dependency in favor of a homemade substitute.
      - Verify frontend changes with npm run lint and npm run build; verify server changes
        with npm run build:server; browser-check every changed UI flow.
      - Keep comments in English; all user-facing strings in Hebrew.
      - >-
        Greenfield only: do not add legacy migrations or backward-compat shims unless
        the user explicitly asks.
      - If export JSON shape changes, update client/src/prompts/ai-review.md in the same change.
  archive:
    guidance:
      - Summarize what shipped vs what was left as a prototype (e.g. iframe demo).
      - Note any draft-shape / schemaVersion bump so the next agent does not miss it.
